name: CodeQL Security Analysis

# Code scanning for this public repo (free, and the SARIF upload is accepted).
# Same CodeQL release and permissions as fc-mobile's workflow. It is not a
# required check: a finding shows under Security > Code scanning and on the PR,
# and does not block a merge until the first results have been triaged.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    # Weekly, Sundays 03:17 UTC: new queries reach code that has not changed.
    - cron: '17 3 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # A fork's develop is a mirror of upstream (CI policy "fork shift-left" in
    # ci.yml): its pushes run nothing. Pull requests and the schedule run as is.
    if: github.event_name != 'push' || github.repository_owner == 'FigureCollecting'
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: "/language:javascript-typescript"
