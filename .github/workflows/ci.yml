name: CI

on:
  push:
    branches: ['**']   # every branch; the job-level gate below decides what runs
    tags: ['v*']       # a release tag publishes the image under its own tag
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

# ---------------------------------------------------------------------------
# CI policy: "fork shift-left" (memory `fork-shift-left-ci-policy`, and the
# same gate fc-shared/fc-backend/scraper/fc-mobile use). Developers work on
# forks and open PRs to FigureCollecting/*. Every push event is gated per entry
# job by ONE expression; pull_request behaves normally. The four push cases:
#   owner == FigureCollecting, ref develop|main -> RUN  (upstream integration branches)
#   owner == FigureCollecting, any other ref    -> SKIP (gets CI via its PR)
#   owner != FigureCollecting, ref develop|main -> SKIP (fork mirrors of upstream)
#   owner != FigureCollecting, any other ref    -> RUN  (shift-left on fork features)
#   owner == FigureCollecting, a v* TAG        -> RUN  (a release tag publishes)
#
# TWO IMAGE JOBS, AND THE SPLIT IS THE POINT. `image` builds, loads and asserts
# non-root; it runs on every pull_request and holds `packages: read`. `publish`
# pushes; it runs on org push events only (the integration branches and a v*
# tag) and is the only job that ever holds `packages: write`. They are separate
# jobs because GitHub's `permissions:` takes no expression — a single job cannot
# hold write on push and read on pull_request, so the scope would otherwise
# stand on every PR run of a job that can never publish from one. `publish` then
# pulls the pushed digest back and re-asserts non-root against those exact
# bytes, because it is a second buildx invocation and "the cache will have hit"
# is not an assertion. The GHCR package inherits the org's no-public-packages
# policy, so it is private and the cluster pulls it with the `ghcr-pull`
# imagePullSecret that scraper, ingest-server and fc-backend already use.
#
# Package auth: `npm ci` reads the PRIVATE @figurecollecting/fc-shared from
# GitHub Packages via the repo .npmrc's ${NODE_AUTH_TOKEN} placeholder. A fork
# run supplies a fork-held PAT (read:packages only) as secrets.NODE_AUTH_TOKEN;
# on the org, GITHUB_TOKEN reads the same-org private package.
# ---------------------------------------------------------------------------

jobs:
  build-and-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'push'
      || (github.repository_owner == 'FigureCollecting' && (github.ref_name == 'develop' || github.ref_name == 'main'))
      || (github.repository_owner == 'FigureCollecting' && github.ref_type == 'tag')
      || (github.repository_owner != 'FigureCollecting' && github.ref_name != 'develop' && github.ref_name != 'main')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 24 matches the fc-shared BOM engines (>=24.15.0) AND the runtime in
          # the Dockerfile, so CI tests the version production runs.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm ci

      # `lint` is `tsc --noEmit`, the fc-shared convention: the type checker is
      # the linter for this toolchain. One invocation, not two identical ones.
      - name: Lint and typecheck
        run: npm run lint

      - name: Test with coverage
        # The 85% line AND branch gate lives in vitest.config.ts, so it fails
        # here and locally on the same thresholds. Testcontainers boots a real
        # postgres:17-alpine for the migration suite; ubuntu-latest ships Docker.
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage to Codecov
        # org-only: no Codecov token is configured for forks, so an upload from
        # a fork push has nothing to authenticate with and only logs an error.
        if: github.repository_owner == 'FigureCollecting'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: coordinator
          fail_ci_if_error: false

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    # ORG ONLY. Forks cannot read the private package with GITHUB_TOKEN and
    # nothing is ever published from a fork.
    if: github.repository_owner == 'FigureCollecting'
    permissions:
      contents: read
      # READ, and it stays read. This job never pushes, on any event, so it has
      # no business holding a registry write scope — and it is the job that runs
      # on every pull_request. `permissions` takes no expression, so the only
      # way to keep write off pull_request runs is to keep the publish in a
      # different job. That is the `publish` job below.
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read service version from package.json
        id: service-version
        run: echo "version=$(node -pe "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        # Build and LOAD, never push. This is the pull_request gate: it proves
        # the production target builds from this tree and that the result is
        # not a root image, and it does so without a credential of any kind.
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          load: true
          tags: fc-coordinator:ci
          build-args: |
            SERVICE_VERSION=${{ steps.service-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Verify the image runs as a non-root user
        run: |
          user=$(docker inspect fc-coordinator:ci --format '{{.Config.User}}')
          echo "image user: ${user}"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::fc-coordinator image runs as root"
            exit 1
          fi

  publish:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: image
    # PUSH EVENTS ONLY. The entry job's gate has already narrowed org push
    # events to develop, main and v* tags, and `needs: image` inherits the
    # org-only condition, so this is the whole remaining test. A pull_request
    # never reaches this job at all — not its login, not its push, and not the
    # `packages: write` scope it declares.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      # THE VALUE THE DEPLOY PINS. fc-infra references this image by digest, not
      # by tag, so a manifest cannot silently follow a retag.
      digest: ${{ steps.publish.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read service version from package.json
        id: service-version
        run: echo "version=$(node -pe "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Lowercase literal rather than github.repository: OCI names must be
          # lowercase and the org is mixed-case.
          images: ghcr.io/figurecollecting/fc-coordinator
          tags: |
            # develop / main
            type=ref,event=branch
            # a v* release tag, under its own name
            type=ref,event=tag
            # the immutable per-commit tag an operator can correlate by eye
            type=sha,format=short,prefix=sha-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image to GHCR
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_VERSION=${{ steps.service-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Verify the PUBLISHED image runs as a non-root user
        # THE BYTES THAT WERE PUSHED, not a sibling build that ought to match.
        #
        # The `image` job asserts non-root against its own `load: true` output,
        # which is the right gate for a pull_request but proves nothing about
        # THIS artifact: this is a second buildx invocation, and the argument
        # that it is identical rests on the GHA cache hitting. It normally will.
        # If it does not — an eviction, a concurrent run, a failed cache write —
        # the published image would never have been asserted at all. So it is
        # pulled back by digest and inspected. An assertion about the artifact
        # has to be made about the artifact.
        run: |
          set -euo pipefail
          ref="ghcr.io/figurecollecting/fc-coordinator@${{ steps.publish.outputs.digest }}"
          echo "inspecting ${ref}"
          docker pull --quiet "${ref}"
          user=$(docker inspect "${ref}" --format '{{.Config.User}}')
          echo "published image user: ${user}"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::the PUBLISHED fc-coordinator image runs as root"
            exit 1
          fi

      - name: Report the published digest
        run: |
          {
            echo "### fc-coordinator image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.publish.outputs.digest }}\`"
            echo
            echo "Pin it in fc-infra as:"
            echo '```'
            echo "ghcr.io/figurecollecting/fc-coordinator:${{ github.ref_name }}@${{ steps.publish.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.publish.outputs.digest }}"
